name: Signalpost starter checks

on:
  push:
  pull_request:

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First-run and repeated project-local setup
        run: |
          ./setup.sh
          ./setup.sh
      - name: Verify two-command evaluator and local PDF OCR
        run: signalpost-starter-kit/.venv/bin/python signalpost-starter-kit/scripts/verify_two_command_workflow.py
      - name: Install uv
        run: python -m pip install uv==0.8.0
      - name: Install locked starter dependencies
        working-directory: signalpost-starter-kit
        run: uv sync --frozen --extra m08-test
      - name: Install pinned test runner
        working-directory: signalpost-starter-kit
        run: uv pip install --python .venv/bin/python pytest==9.1.1
      - name: Run starter tests
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m pytest -q
      - name: Run M07 refresh/history contract tests
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m pytest -q tests/test_signalpost_m07.py
      - name: Run M08 synthesis and query contract tests
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m pytest -q tests/test_signalpost_m08.py
      - name: Evaluate M08 research gold corpus and provenance
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python scripts/evaluate_signalpost_m08.py --output /tmp/signalpost-m08-evaluation.json
      - name: Compile and import production package
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m compileall -q ../signalpost
      - name: Run M03 exact-company website gate
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m pytest -q tests/test_signalpost_m03.py
      - name: Run M04 candidate-only search gate
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m pytest -q tests/test_signalpost_m04.py
      - name: Run M05 jobs and activity gate
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python -m pytest -q tests/test_signalpost_m05.py
      - name: Run M01 offline batch gate
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: >-
          .venv/bin/python -m signalpost.run
          --input tests/fixtures/m01/offline-batch.jsonl
          --registry-snapshot tests/fixtures/m01/registry.jsonl
          --output /tmp/signalpost-m01-output.jsonl
          --state-output /tmp/signalpost-m01-state.json
          --checkpoint /tmp/signalpost-m01-checkpoint.sqlite
          --batch-id ci-m01
      - name: Verify offline batch cardinality
        run: test "$(wc -l < /tmp/signalpost-m01-output.jsonl | tr -d ' ')" = "4"
      - name: Run deterministic refresh replay
        working-directory: signalpost-starter-kit
        run: .venv/bin/python scripts/run_refresh_replay.py --manifest tests/fixtures/refresh-snapshots.json --output /tmp/signalpost-refresh-ci.json
      - name: Run M06 deterministic scale and offline runner gate
        working-directory: signalpost-starter-kit
        env:
          PYTHONPATH: ..
        run: .venv/bin/python scripts/run_m06_scale_gate.py > /tmp/signalpost-m06-scale.json
      - name: Verify M06 benchmark provenance and no synthetic identity claims
        run: python3 signalpost-starter-kit/scripts/verify_m06_scale_gate.py /tmp/signalpost-m06-scale.json
      - name: Run evaluator launcher from unrelated directory without PYTHONPATH
        working-directory: /tmp
        run: >-
          env -u PYTHONPATH
          $GITHUB_WORKSPACE/signalpost-starter-kit/.venv/bin/python
          $GITHUB_WORKSPACE/signalpost-starter-kit/run_signalpost.py
          --input $GITHUB_WORKSPACE/signalpost-starter-kit/tests/fixtures/m01/offline-batch.jsonl
          --registry-snapshot $GITHUB_WORKSPACE/signalpost-starter-kit/tests/fixtures/m01/registry.jsonl
          --output /tmp/signalpost-clean-cwd.jsonl
          --state-output /tmp/signalpost-clean-cwd-state.json
          --checkpoint /tmp/signalpost-clean-cwd-checkpoint.sqlite
      - name: Verify clean CWD evaluator cardinality
        run: test "$(wc -l < /tmp/signalpost-clean-cwd.jsonl | tr -d ' ')" = "4"
      - name: Smoke test server-rendered UX from clean working directory
        working-directory: /tmp
        run: >-
          $GITHUB_WORKSPACE/signalpost-starter-kit/.venv/bin/python
          $GITHUB_WORKSPACE/signalpost-starter-kit/scripts/smoke_m08_web.py
          --data /tmp/signalpost-clean-cwd.jsonl
      - name: Independent public-contract process and failure acceptance
        working-directory: signalpost-starter-kit
        run: .venv/bin/python scripts/validate_signalpost_functionality.py --output-dir /tmp/signalpost-independent-acceptance

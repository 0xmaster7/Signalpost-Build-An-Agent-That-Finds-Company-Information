version: 1
sources:
  brreg_ccr:
    name: Brønnøysund Register Centre Central Coordinating Register
    hosts:
      - data.brreg.no
    endpoints:
      - /enhetsregisteret/api/enheter/{organisation_number}
      - /enhetsregisteret/api/enheter/{organisation_number}/roller
      - /enhetsregisteret/api/underenheter?overordnetEnhet={organisation_number}
      - /enhetsregisteret/api/konsernstruktur/{organisation_number}
    acquisition:
      mode: documented_public_get
      gateway: signalpost.network.NetworkGateway
      robots:
        enforce_explicit_rules: true
        on_unreachable: allow_only_documented_structured_api_paths
      redirects: same_host_only
      user_agent_contact: pending_builderr_contact
    rights:
      license: NLOD-2.0
      reference: https://data.brreg.no/enhetsregisteret/api/dokumentasjon/en/index.html
      attribution: "Brønnøysund Register Centre (Brønnøysundregistrene), retrieved {date}, NLOD 2.0"
    retention:
      response_bodies: run_scoped
      persistent_raw_cache: false
      retain_provenance: [source_url, retrieved_at, content_sha256, json_pointer, extraction_method, source_snapshot]
    personal_data:
      allow_public_role_name: true
      allow_public_role_and_business_relation: true
      retain_birth_date: false
      retain_national_identifier: false
      retain_private_address: false
      retain_private_contact: false
      enk_registration_addresses: omit
  brreg_accounts:
    name: Brønnøysund Register Centre Register of Company Accounts
    hosts:
      - data.brreg.no
    endpoints:
      - /regnskapsregisteret/regnskap/{organisation_number}
    acquisition:
      mode: documented_public_get
      gateway: signalpost.network.NetworkGateway
      robots:
        enforce_explicit_rules: true
        on_unreachable: allow_only_documented_structured_api_paths
      redirects: same_host_only
      user_agent_contact: pending_builderr_contact
    rights:
      license: NLOD-2.0
      reference: https://www.brreg.no/bruke-data-fra-bronnoysundregistrene/datasett-og-api/
      attribution: "Brønnøysund Register Centre (Brønnøysundregistrene), retrieved {date}, NLOD 2.0"
    retention:
      response_bodies: run_scoped
      persistent_raw_cache: false
      retain_provenance: [source_url, retrieved_at, content_sha256, json_pointer, extraction_method, source_snapshot]
  brreg_account_copy:
    name: Official annual-account filing copies
    hosts: [data.brreg.no]
    endpoints: ["/regnskapsregisteret/regnskap/aarsregnskap/kopi/{organisation_number}/{year}"]
    acquisition:
      mode: documented_public_get
      gateway: signalpost.network.NetworkGateway
      access_profile: brreg_document_api
      robots:
        enforce_explicit_rules: true
        on_unreachable: allow_only_exact_documented_filing_copy_api
      redirects: same_host_and_exact_document_path_only
      request_start_interval_seconds: 2.1
      pdf_bytes: 26214400
      ocr_workers: 2
      ocr_timeout_seconds: 90
      ocr_pages: 7
    rights:
      reference: https://data.brreg.no/regnskapsregisteret/regnskap/v3/api-docs
      basis: public_official_filing_factual_extraction
      attribution: Brønnøysundregistrene and the identified company filing
      document_republication: false
    retention:
      response_bodies: run_scoped
      ocr_cache: run_scoped_document_sha256
      retain_provenance: [source_url, retrieved_at, content_sha256, page_number, excerpt, reporting_period, source_snapshot]
  nav_jobs:
    name: NAV Arbeidsplassen official vacancy feed
    hosts: [pam-stilling-feed.nav.no]
    endpoints: ["/api/publicToken", "/api/v1/feed", "/api/v1/feed/{page}", "/api/v1/feedentry/{uuid}"]
    acquisition:
      mode: documented_public_get_with_runtime_public_token
      gateway: signalpost.network.NetworkGateway
      access_profile: nav_feed_api
      robots:
        enforce_explicit_rules: true
        on_unreachable: allow_only_documented_nav_feed_paths
      redirects: reject
      time_seconds: 20
      max_feed_pages: 4
      max_detail_requests: 8
      recent_window_days: 40
      negative_coverage: false
    rights:
      reference: https://arbeidsplassen.nav.no/vilkar-api
      basis: permitted_factual_metadata_analysis
      attribution: NAV Arbeidsplassen, identified vacancy and retrieval date
      dataset_mit_license: false
    retention:
      response_bodies: transient
      tokens: memory_only
      personal_contacts: discard
      stale_open_ads: do_not_retain_on_refresh
      retain_provenance: [source_url, retrieved_at, content_sha256, json_pointer, extraction_method, source_snapshot]
  wikidata_candidates:
    hosts: [query.wikidata.org]
    acquisition:
      mode: candidate_only_batch_sparql
      gateway: signalpost.network.NetworkGateway
      robots:
        enforce_explicit_rules: true
        on_unreachable: skip
      max_companies: 200
      time_seconds: 12
    rights:
      reference: https://www.wikidata.org/wiki/Wikidata:Licensing
      license: CC0
    retention:
      response_bodies: transient
      published_facts_without_ownership_proof: false
  builderr_frozen_registry:
    name: Builderr evaluator frozen registry snapshot
    hosts: []
    endpoints: []
    acquisition:
      mode: supplied_local_snapshot
      streaming: true
      source_url_required_for_publication: true
    rights:
      license: unresolved
      reference: unresolved
      attribution: unresolved
    retention:
      response_bodies: unresolved
      persistent_raw_cache: unresolved
      retain_provenance: [snapshot_sha256, as_of, source_url, matched_row_hash]
  company_owned_website:
    name: Exact-company owned public website
    hosts: []
    endpoints:
      - /robots.txt
      - /
      - /about
      - /contact
      - /legal
      - /sitemap.xml
      - /careers and exact-site job postings
      - /news, /press, /blog and public RSS and Atom feeds linked from the verified site
    acquisition:
      mode: bounded_public_get
      gateway: signalpost.network.NetworkGateway
      candidate_sources: [builderr_frozen_registry, brreg_ccr, conservative_keyless_no]
      verification_required_before_claims: true
      search_enabled: false
      redirects: same_host_and_allowlisted_aliases_only
      robots:
        enforce_explicit_rules: true
        on_unreachable: fail_closed
        crawl_delay: honor
      limits:
        initial_page_target: 6
        default_pages_per_company: 10
        absolute_pages_per_company: 25
        depth: 2
        page_bytes: 2097152
        company_bytes: 8388608
        sitemap_indexes: 5
        sitemap_urls: 100
        feeds: 5
      user_agent_contact: pending_builderr_contact
    rights:
      license: site_specific_terms_unreviewed
      reference: public site terms and robots.txt
      attribution: source URL and retrieval date retained per claim
      acquisition_scope: transient factual extraction from public pages, exact-site jobs and dated company-owned activity
    retention:
      response_bodies: run_scoped
      persistent_raw_cache: false
      retain_provenance: [source_url, retrieved_at, content_sha256, extraction_method, source_snapshot, deterministic_identity_proof]
    personal_data:
      allow_public_company_description: true
      allow_public_products_and_services: true
      allow_public_contact_personal_data: false
  search_discovery:
    name: Optional reproducible search provider, candidate discovery only
    hosts: []
    endpoints: []
    acquisition:
      mode: disabled_until_provider_and_rights_approved
      interface: signalpost.discovery.SearchProvider
      gateway: signalpost.network.NetworkGateway
      retry_policy: disabled_or_fully_visible_in_request_ledger
      result_use: candidate_generation_only
      snippet_title_rank_as_evidence: false
      directory_or_third_party_profile_as_owned_site: false
      search_candidate_strong_proof: subject_scoped_structured_org_number
      provider_enabled: false
    rights:
      license: unresolved
      reference: unresolved
      reproducibility: unresolved
    retention:
      raw_results: disabled
      provider_output: candidate_url_and_trace_metadata_only_after_approval
      retain_provenance: [provider_id, provider_version, query_id, result_id, rank, response_sha256]
